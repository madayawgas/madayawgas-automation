name: Test Project Access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: List organization projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Organization: ${{ github.repository_owner }}"
          echo ""
          echo "Projects:"
          gh project list \
            --owner "${{ github.repository_owner }}" \
            --format json
